<script>
    let selectedRobux = 0;
    let timer = null;

    function updateUser() {
        const username = document.getElementById('username').value.trim();
        const userTag = document.getElementById('userTag');
        const avatarPic = document.getElementById('avatarPic');
        const defaultAvatar = document.getElementById('defaultAvatar');

        clearTimeout(timer);

        if (username.length > 0) {
            userTag.innerText = '@' + username;
            
            // Jeda 400ms saat mengetik agar tidak spam request
            timer = setTimeout(async () => {
                try {
                    // 1. Ambil User ID Roblox dari Username (menggunakan CORS Proxy)
                    const userReq = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://users.roblox.com/v1/usernames/users'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ usernames: [username], excludeBannedUsers: false })
                    });
                    const userData = await userReq.json();

                    if (userData.data && userData.data.length > 0) {
                        const userId = userData.data[0].id;

                        // 2. Ambil URL Gambar Avatar Headshot Roblox menggunakan User ID tersebut
                        const thumbReq = await fetch(`https://corsproxy.io/?` + encodeURIComponent(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=false`));
                        const thumbData = await thumbReq.json();

                        if (thumbData.data && thumbData.data.length > 0) {
                            avatarPic.src = thumbData.data[0].imageUrl;
                            avatarPic.style.display = 'block';
                            defaultAvatar.style.display = 'none';
                        }
                    } else {
                        // Jika username tidak ketemu
                        avatarPic.style.display = 'none';
                        defaultAvatar.style.display = 'flex';
                    }
                } catch (err) {
                    console.log("Gagal mengambil avatar:", err);
                    avatarPic.style.display = 'none';
                    defaultAvatar.style.display = 'flex';
                }
            }, 400);
        } else {
            userTag.innerText = '@Username';
            avatarPic.style.display = 'none';
            defaultAvatar.style.display = 'flex';
        }
    }

    function selectAmount(element, amount) {
        document.querySelectorAll('.robux-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        selectedRobux = amount;
    }

    function startSend() {
        const username = document.getElementById('username').value.trim();
        if (!username) {
            alert('Please enter a Roblox username!');
            return;
        }
        if (selectedRobux === 0) {
            alert('Please select an amount of Robux!');
            return;
        }

        document.getElementById('formCard').style.display = 'none';
        document.getElementById('loadingCard').style.display = 'block';

        setTimeout(() => {
            document.getElementById('statusText').innerText = `Transferring R$ ${selectedRobux.toLocaleString()} to @${username}...`;
        }, 1500);

        setTimeout(() => {
            document.getElementById('loadingCard').style.display = 'none';
            document.getElementById('successCard').style.display = 'block';
            document.getElementById('finalAvatarPic').src = document.getElementById('avatarPic').src;
            document.getElementById('successText').innerHTML = `Successfully transferred <b>R$ ${selectedRobux.toLocaleString()}</b> to <b>@${username}</b>!`;
        }, 3500);
    }

    function resetForm() {
        document.getElementById('successCard').style.display = 'none';
        document.getElementById('formCard').style.display = 'block';
        document.getElementById('username').value = '';
        updateUser();
        document.querySelectorAll('.robux-btn').forEach(btn => btn.classList.remove('active'));
        selectedRobux = 0;
    }
</script>
